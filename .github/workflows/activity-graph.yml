name: Generate Contribution Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/contributions.svg
          hide-keys: general, languages, repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/contributions.svg

          if git diff --cached --quiet; then
            echo "No graph changes."
          else
            git commit -m "Update contribution activity graph"
            git push
          fi
